plugins {
    id 'dev.architectury.loom' version '1.13.469'
    id 'maven-publish'
}

group = project.maven_group
version = project.mod_version

base {
    archivesName = project.mod_id
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
    it.options.encoding = 'UTF-8'
}

loom {
    forge {
        mixinConfig "simplyanime.mixins.json"
    }
}

repositories {
    maven {
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
    maven { url = "https://maven.architectury.dev/" }
    maven { url = "https://maven.fzzyhmstrs.me/" }
    maven { url = "https://thedarkcolour.github.io/KotlinForForge/" }
    maven { url = "https://jitpack.io" }
}

dependencies {
    minecraft "net.minecraft:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    forge "net.minecraftforge:forge:${project.forge_version}"

    modImplementation "dev.architectury:architectury-forge:${project.architectury_api_version}"
    modImplementation "maven.modrinth:simply-swords:${project.simply_swords_version}"
    modImplementation("me.fzzyhmstrs:fzzy_config:${project.fzzy_config_version}+forge") {
        transitive = false
    }

    // everything below is only so runClient boots with simply swords' own deps
    modRuntimeOnly "maven.modrinth:simply-tooltips:${project.simply_tooltips_version}"
    modRuntimeOnly "thedarkcolour:kfflang:${project.kotlinforforge_version}"
    modRuntimeOnly "thedarkcolour:kfflib:${project.kotlinforforge_version}"
    modRuntimeOnly "thedarkcolour:kffmod:${project.kotlinforforge_version}"
    forgeRuntimeLibrary "org.jetbrains.kotlin:kotlin-stdlib:2.0.20"
    forgeRuntimeLibrary "org.jetbrains.kotlin:kotlin-reflect:2.0.20"
    forgeRuntimeLibrary "blue.endless:jankson:1.2.3"
    forgeRuntimeLibrary "net.peanuuutz.tomlkt:tomlkt-jvm:0.3.7"
    forgeRuntimeLibrary "org.jetbrains.kotlinx:kotlinx-serialization-json-jvm:1.6.3"
    forgeRuntimeLibrary "org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.10.2"
    modRuntimeOnly "com.github.ZsoltMolnarrr:TinyConfig:2.3.2"
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }
}
