plugins {
    id 'dev.architectury.loom' version '1.13.469'
    id 'maven-publish'
}

group = project.maven_group
version = project.mod_version

base {
    archivesName = project.mod_id
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
    it.options.encoding = 'UTF-8'
}

// dev only test mod, never goes in the jar
sourceSets {
    autotest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

loom {
    forge {
        mixinConfig "simplyanime.mixins.json"
    }
    // gradlew runClient -Pautotest -Pshaders=all -Peffect=sun,ea
    if (project.hasProperty('autotest')) {
        mods {
            simplyanime {
                sourceSet sourceSets.main
            }
            simplyanime_autotest {
                sourceSet sourceSets.autotest
            }
        }
        runs {
            client {
                runDir 'run-autotest'
                property 'simplyanime.autotest', 'true'
                property 'simplyanime.autotest.shaders', (project.findProperty('shaders') ?: '').toString()
                property 'simplyanime.autotest.effect', (project.findProperty('effect') ?: '').toString()
                property 'simplyanime.autotest.time', (project.findProperty('time') ?: '13200').toString()
                programArgs '--width', '1280', '--height', '720'
            }
        }
    }
}

tasks.matching { it.name == 'runClient' && project.hasProperty('autotest') }.configureEach {
    dependsOn 'autotestClasses'
    doFirst {
        delete 'run-autotest/saves/autotest', 'run-autotest/screenshots'
    }
}

repositories {
    maven {
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
    maven { url = "https://maven.architectury.dev/" }
    maven { url = "https://maven.fzzyhmstrs.me/" }
    maven { url = "https://thedarkcolour.github.io/KotlinForForge/" }
    maven { url = "https://jitpack.io" }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraft:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    forge "net.minecraftforge:forge:${project.forge_version}"

    modImplementation "dev.architectury:architectury-forge:${project.architectury_api_version}"
    modImplementation "maven.modrinth:simply-swords:${project.simply_swords_version}"
    modImplementation("me.fzzyhmstrs:fzzy_config:${project.fzzy_config_version}+forge") {
        transitive = false
    }

    // everything below is only so runClient boots with simply swords' own deps
    modRuntimeOnly "maven.modrinth:simply-tooltips:${project.simply_tooltips_version}"
    modRuntimeOnly "thedarkcolour:kfflang:${project.kotlinforforge_version}"
    modRuntimeOnly "thedarkcolour:kfflib:${project.kotlinforforge_version}"
    modRuntimeOnly "thedarkcolour:kffmod:${project.kotlinforforge_version}"
    forgeRuntimeLibrary "org.jetbrains.kotlin:kotlin-stdlib:2.0.20"
    forgeRuntimeLibrary "org.jetbrains.kotlin:kotlin-reflect:2.0.20"
    forgeRuntimeLibrary "blue.endless:jankson:1.2.3"
    forgeRuntimeLibrary "net.peanuuutz.tomlkt:tomlkt-jvm:0.3.7"
    forgeRuntimeLibrary "org.jetbrains.kotlinx:kotlinx-serialization-json-jvm:1.6.3"
    forgeRuntimeLibrary "org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.10.2"
    modRuntimeOnly "com.github.ZsoltMolnarrr:TinyConfig:2.3.2"

    // Better Combat in the dev client to test the weapons with it, never shipped
    modRuntimeOnly "maven.modrinth:better-combat:${project.better_combat_version}"
    modRuntimeOnly "maven.modrinth:playeranimator:${project.player_animator_version}"
    modRuntimeOnly "maven.modrinth:cloth-config:${project.cloth_config_version}"
    modRuntimeOnly "io.github.llamalad7:mixinextras-forge:0.4.1"
    forgeRuntimeLibrary "io.github.llamalad7:mixinextras-common:0.4.1"

    // Oculus + Embeddium in the dev client to test the effects under shader packs, never shipped
    modRuntimeOnly "maven.modrinth:oculus:${project.oculus_version}"
    modRuntimeOnly "maven.modrinth:embeddium:${project.embeddium_version}"
    // bundled inside the Oculus jar, but the dev launcher doesn't unpack it
    forgeRuntimeLibrary "org.anarres:jcpp:1.4.14"
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }
}
